<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contas Pessoais — Painel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --bg:#0b0f14;
  --surface:#141a22;
  --surface2:#1b232d;
  --line:rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.12);
  --text:#e7eef6;
  --muted:#8b9aab;
  --pos:#3ddc97;
  --neg:#ff7089;
  --gold:#f5c451;
  --blue:#6bb8ff;
  --shadow:0 18px 40px -22px rgba(0,0,0,.8);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;-webkit-font-smoothing:antialiased}
body{
  min-height:100vh;
  background:
    radial-gradient(900px 500px at 85% -8%, rgba(61,220,151,.10), transparent 60%),
    radial-gradient(800px 500px at 0% 0%, rgba(107,184,255,.08), transparent 55%),
    var(--bg);
  padding:clamp(18px,4vw,48px);
}
.wrap{max-width:1180px;margin:0 auto}
.num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.3px}

/* HEADER */
header{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:30px}
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(30px,5vw,46px);line-height:.98;letter-spacing:-1px}
h1 span{color:var(--pos)}
.sub{color:var(--muted);font-size:14px;margin-top:8px}
.controls{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
button.sync{
  font-family:'Sora';font-weight:600;font-size:14px;color:#06231a;cursor:pointer;
  background:linear-gradient(180deg,#54e9a8,#2fcb89);border:none;border-radius:12px;
  padding:12px 18px;display:flex;gap:9px;align-items:center;box-shadow:0 10px 22px -10px rgba(61,220,151,.6);
  transition:transform .15s ease, box-shadow .15s ease;
}
button.sync:hover{transform:translateY(-2px);box-shadow:0 16px 26px -10px rgba(61,220,151,.7)}
button.sync:active{transform:translateY(0)}
button.sync:disabled{opacity:.6;cursor:wait;transform:none}
.dot{width:8px;height:8px;border-radius:50%;background:#06231a}
.status{font-size:12.5px;color:var(--muted);min-height:16px;text-align:right}
.status.ok{color:var(--pos)} .status.err{color:var(--neg)} .status.loading{color:var(--gold)}

/* KPI STRIP */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px}
.kpi .lbl{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:'Bricolage Grotesque';font-weight:700;font-size:26px;margin-top:8px}
.kpi .val.pos{color:var(--pos)} .kpi .val.neg{color:var(--neg)} .kpi .val.gold{color:var(--gold)}

/* MONTH CARDS */
.section-title{font-family:'Bricolage Grotesque';font-weight:700;font-size:18px;margin:0 0 14px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:34px}
.mcard{
  background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);
  border-radius:16px;padding:16px;position:relative;overflow:hidden;
  opacity:0;transform:translateY(10px);animation:rise .5s ease forwards;
}
@keyframes rise{to{opacity:1;transform:none}}
.mcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accentbar,var(--pos))}
.mcard .mname{font-weight:600;font-size:14px;color:var(--text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.mcard .tag{font-size:10px;color:var(--muted);border:1px solid var(--line2);border-radius:20px;padding:2px 8px}
.line{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin:6px 0}
.line .k{color:var(--muted)}
.line .v{font-family:'JetBrains Mono';font-variant-numeric:tabular-nums}
.mcard .sobra{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2)}
.mcard .sobra .v{font-weight:700;font-size:16px}
.acc{margin-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.acc .k{color:var(--muted)} .acc .v{font-family:'JetBrains Mono';font-weight:700;color:var(--gold)}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* MATRIX TABLE */
.tablecard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;overflow-x:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:13px 14px;text-align:right;font-size:13px;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--line2)}
tbody td{border-bottom:1px solid var(--line);font-family:'JetBrains Mono';font-variant-numeric:tabular-nums}
tbody td:first-child{font-family:'Sora'}
.desc{font-weight:500}
.sit{font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:1px 7px;margin-left:8px}
.cell{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end}
.sdot{width:7px;height:7px;border-radius:50%;flex:none}
.sdot.pendente{background:var(--gold)} .sdot.pago{background:var(--pos)}
.muted{color:var(--muted)}
tr.entrada td{color:var(--blue);font-weight:700}
tr.entrada td:first-child{color:var(--blue)}
tfoot td{font-family:'JetBrains Mono';font-variant-numeric:tabular-nums;font-weight:700;padding:13px 14px;font-size:13px}
tfoot td:first-child{font-family:'Sora'}
tfoot tr.gastos td{color:var(--neg);border-top:2px solid var(--line2)}
tfoot tr.sobra td{color:var(--pos)}
tfoot tr.acumulado td{color:var(--gold)}
tfoot tr.acumulado{background:rgba(245,196,81,.05)}

footer{color:var(--muted);font-size:12px;margin-top:26px;line-height:1.7}
footer code{font-family:'JetBrains Mono';background:var(--surface);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Planilha · constas pessoais</div>
      <h1>Gastos <span>mensais</span></h1>
      <div class="sub" id="sub">Entrada de R$ 10.000 por mês · acompanhando o que sobra e acumula</div>
    </div>
    <div class="controls">
      <button class="sync" id="syncBtn" onclick="refreshFromDrive()">
        <span class="dot"></span> Atualizar do Drive
      </button>
      <div class="status" id="status"></div>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="section-title">Por mês</div>
  <div class="months" id="months"></div>

  <div class="section-title">Detalhamento</div>
  <div class="tablecard">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
  </div>

  <div class="legend">
    <span><span class="sdot pendente"></span> Pendente</span>
    <span><span class="sdot pago"></span> Pago</span>
    <span class="muted">— sem cobrança no mês</span>
  </div>

  <footer id="footer"></footer>
</div>

<script>
const FILE_ID = "1jx8HcUYkg3yImqTDYTKwOMEO2zI-2ajGssa9OY0R-i0";

/* ===== Snapshot atual da planilha (lido em 30/05/2026) ===== */
let DATA = {
  snapshot: "30/05/2026",
  months: ["06/2026","07/2026","08/2026","09/2026","10/2026","11/2026"],
  entrada: [10000,10000,10000,10000,10000,10000],
  items: [
    {descricao:"pensao",              situacao:"fixo", valores:[660,660,660,660,660,660],  status:["pendente","pendente","pendente","pendente","pendente","pendente"]},
    {descricao:"moto alexandre",      situacao:"1/4",  valores:[2000,2000,2000,2000,null,null], status:["pendente","pendente","pendente","pendente",null,null]},
    {descricao:"aluguel abba studio", situacao:"fixo", valores:[1000,1000,1000,1000,1000,1000], status:["pendente","pendente","pendente","pendente","pendente","pendente"]},
    {descricao:"teclado ph",          situacao:"1/3",  valores:[500,500,500,null,null,null], status:["pendente","pendente","pendente",null,null,null]},
    {descricao:"academia",            situacao:"fixo", valores:[99,99,99,99,99,99],        status:["pendente","pendente","pendente","pendente","pendente","pendente"]},
    {descricao:"cameras casa",        situacao:"fixo", valores:[99,99,99,99,99,99],        status:["pendente","pendente","pendente","pendente","pendente","pendente"]},
  ]
};

/* ===== Helpers ===== */
const fmt = n => (n==null||isNaN(n)) ? "—" : new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);
const cls = n => n>0 ? 'pos' : (n<0 ? 'neg' : '');

function compute(){
  const m = DATA.months.length;
  const gastos=[], sobra=[], acumulado=[];
  let run=0;
  for(let i=0;i<m;i++){
    let g=0;
    DATA.items.forEach(it=>{ const v=it.valores[i]; if(v!=null && !isNaN(v)) g+=Number(v); });
    const ent = Number(DATA.entrada[i]||0);
    const s = ent - g;
    run += s;
    gastos.push(g); sobra.push(s); acumulado.push(run);
  }
  return {gastos,sobra,acumulado};
}

function render(){
  const {gastos,sobra,acumulado} = compute();
  const M = DATA.months;
  const totalEnt = DATA.entrada.reduce((a,b)=>a+Number(b||0),0);
  const totalGas = gastos.reduce((a,b)=>a+b,0);
  const saldoFinal = acumulado[acumulado.length-1] || 0;

  document.getElementById('sub').textContent =
    `Entrada de ${fmt(DATA.entrada[0]||0)} por mês · ${M.length} meses · o que sobra acumula mês a mês`;

  /* KPIs */
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="lbl">Total de entradas</div><div class="val">${fmt(totalEnt)}</div></div>
    <div class="kpi"><div class="lbl">Total de gastos</div><div class="val neg">${fmt(totalGas)}</div></div>
    <div class="kpi"><div class="lbl">Saldo acumulado</div><div class="val gold">${fmt(saldoFinal)}</div></div>
    <div class="kpi"><div class="lbl">Meses no plano</div><div class="val">${M.length}</div></div>
  `;

  /* Month cards */
  document.getElementById('months').innerHTML = M.map((mo,i)=>{
    const bar = sobra[i]>=0 ? 'var(--pos)' : 'var(--neg)';
    return `<div class="mcard" style="--accentbar:${bar};animation-delay:${i*60}ms">
      <div class="mname">${mo}</div>
      <div class="line"><span class="k">Entrada</span><span class="v">${fmt(DATA.entrada[i])}</span></div>
      <div class="line"><span class="k">Gastos</span><span class="v neg">- ${fmt(gastos[i]).replace('R$','R$')}</span></div>
      <div class="sobra line"><span class="k">Sobrou</span><span class="v ${cls(sobra[i])}">${fmt(sobra[i])}</span></div>
      <div class="acc"><span class="k">Acumulado</span><span class="v">${fmt(acumulado[i])}</span></div>
    </div>`;
  }).join('');

  /* Table head */
  document.getElementById('thead').innerHTML =
    `<tr><th>Descrição</th>${M.map(mo=>`<th>${mo}</th>`).join('')}</tr>`;

  /* Table body */
  let rows = `<tr class="entrada"><td>Entrada</td>${M.map((_,i)=>`<td>${fmt(DATA.entrada[i])}</td>`).join('')}</tr>`;
  rows += DATA.items.map(it=>{
    const cells = M.map((_,i)=>{
      const v = it.valores[i];
      if(v==null||isNaN(v)) return `<td><span class="muted">—</span></td>`;
      const st = it.status[i] || 'pendente';
      return `<td><span class="cell"><span class="sdot ${st}"></span>${fmt(v)}</span></td>`;
    }).join('');
    return `<tr><td><span class="desc">${it.descricao}</span><span class="sit">${it.situacao||''}</span></td>${cells}</tr>`;
  }).join('');
  document.getElementById('tbody').innerHTML = rows;

  /* Table foot */
  document.getElementById('tfoot').innerHTML = `
    <tr class="gastos"><td>Gastos do mês</td>${gastos.map(g=>`<td>- ${fmt(g)}</td>`).join('')}</tr>
    <tr class="sobra"><td>Sobrou no mês</td>${sobra.map(s=>`<td>${fmt(s)}</td>`).join('')}</tr>
    <tr class="acumulado"><td>Saldo acumulado</td>${acumulado.map(a=>`<td>${fmt(a)}</td>`).join('')}</tr>
  `;

  document.getElementById('footer').innerHTML =
    `Fonte: planilha <code>constas pessoais</code> no Google Drive. Última leitura: ${DATA.snapshot}.<br>
     Clique em <b>Atualizar do Drive</b> sempre que mudar a planilha para recalcular tudo automaticamente.`;
}

/* ===== Atualização ao vivo lendo o Drive ===== */
function setStatus(msg, kind){
  const el=document.getElementById('status');
  el.textContent=msg; el.className='status '+(kind||'');
}
function extractJson(t){
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<0) throw new Error('JSON não encontrado');
  return t.slice(a,b+1);
}
function normalize(p){
  const n = p.months.length;
  const pad = arr => { arr=Array.isArray(arr)?arr.slice(0,n):[]; while(arr.length<n)arr.push(null); return arr; };
  return {
    snapshot: new Date().toLocaleString('pt-BR'),
    months: p.months,
    entrada: pad(p.entrada).map(x=>x==null?0:Number(x)),
    items: (p.items||[]).map(it=>({
      descricao: it.descricao||'',
      situacao: it.situacao||'',
      valores: pad(it.valores).map(x=>(x==null||x==='')?null:Number(x)),
      status: pad(it.status).map(x=>x?String(x).toLowerCase():null)
    }))
  };
}

async function refreshFromDrive(){
  const btn=document.getElementById('syncBtn');
  btn.disabled=true; setStatus('Lendo a planilha no Drive…','loading');
  const prompt = `Use a ferramenta read_file_content do Google Drive para ler o arquivo de fileId "${FILE_ID}". `+
    `É uma planilha de gastos mensais. Responda APENAS com um objeto JSON (sem markdown, sem texto extra) exatamente neste formato: `+
    `{"months":["MM/AAAA",...],"entrada":[numero por mes],"items":[{"descricao":string,"situacao":string,"valores":[numero ou null por mes],"status":[string ou null por mes]}]}. `+
    `A primeira linha de dados é a "entrada" (receita) por mês. Nas demais linhas: coluna 1 = descricao, coluna 2 = situacao (ex: "fixo" ou "1/4"), depois alternam valor e status por mês. `+
    `Use null onde o mês não tiver valor. Retorne números puros, sem "R$" nem pontos de milhar.`;
  try{
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:4000,
        messages:[{role:"user",content:prompt}],
        mcp_servers:[{type:"url",url:"https://drivemcp.googleapis.com/mcp/v1",name:"google-drive"}]
      })
    });
    const data = await res.json();
    const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const parsed = JSON.parse(extractJson(text));
    if(!parsed.months || !parsed.months.length) throw new Error('sem meses');
    DATA = normalize(parsed);
    render();
    setStatus('Atualizado a partir do Drive ✓','ok');
  }catch(e){
    console.error(e);
    setStatus('Não consegui sincronizar agora — mostrando os últimos dados lidos.','err');
  }finally{
    btn.disabled=false;
  }
}

render();
</script>
</body>
</html>
