<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contas Pessoais — Painel ao vivo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');
:root{--bg:#0b0f14;--surface:#141a22;--surface2:#1b232d;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
--text:#e7eef6;--muted:#8b9aab;--pos:#3ddc97;--neg:#ff7089;--gold:#f5c451;--blue:#6bb8ff;--shadow:0 18px 40px -22px rgba(0,0,0,.8);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(900px 500px at 85% -8%,rgba(61,220,151,.10),transparent 60%),radial-gradient(800px 500px at 0% 0%,rgba(107,184,255,.08),transparent 55%),var(--bg);padding:clamp(18px,4vw,48px);}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(30px,5vw,46px);line-height:.98;letter-spacing:-1px}
h1 span{color:var(--pos)}
.sub{color:var(--muted);font-size:14px;margin-top:8px}
.controls{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.row{display:flex;gap:8px;align-items:center}
button,select,input{font-family:'Sora';font-size:13px}
button.sync{font-weight:600;color:#06231a;cursor:pointer;background:linear-gradient(180deg,#54e9a8,#2fcb89);border:none;border-radius:12px;padding:11px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 22px -10px rgba(61,220,151,.6);transition:transform .15s}
button.sync:hover{transform:translateY(-2px)} button.sync:disabled{opacity:.6;cursor:wait;transform:none}
select{background:var(--surface2);color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:9px 10px}
.live{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.beat{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.beat.on{background:var(--pos);animation:p 2s infinite}.beat.err{background:var(--neg)}.beat.load{background:var(--gold)}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(61,220,151,.5)}70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.status{font-size:12.5px;color:var(--muted);text-align:right;min-height:16px}
.status.ok{color:var(--pos)}.status.err{color:var(--neg)}.status.load{color:var(--gold)}
.srcbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:26px;font-size:12.5px;color:var(--muted)}
.srcbar input{flex:1;min-width:220px;background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:8px 10px}
.srcbar button.mini{background:var(--surface2);color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:8px 12px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:30px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.kpi .lbl{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:'Bricolage Grotesque';font-weight:700;font-size:26px;margin-top:8px}
.kpi .val.neg{color:var(--neg)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.section-title{font-family:'Bricolage Grotesque';font-weight:700;font-size:18px}
.btn-all{background:var(--surface2);color:var(--muted);border:1px solid var(--line2);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:12.5px}
.btn-all:hover{color:var(--text)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:34px}
.mcard{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.mcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accentbar,var(--pos))}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;user-select:none}
.mname{font-weight:600;font-size:14px}
.head-right{display:flex;align-items:center;gap:10px}
.head-sobra{font-family:'JetBrains Mono';font-weight:700;font-size:15px}
.chev{color:var(--muted);font-size:11px;transition:transform .2s}
.mcard.collapsed .chev{transform:rotate(-90deg)}
.mbody{overflow:hidden;max-height:320px;opacity:1;margin-top:12px;transition:max-height .25s ease,opacity .2s,margin-top .2s}
.mcard.collapsed .mbody{max-height:0;opacity:0;margin-top:0}
.line{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin:6px 0}
.line .k{color:var(--muted)} .line .v{font-family:'JetBrains Mono';font-variant-numeric:tabular-nums}
.gastos-line{padding-top:8px;border-top:1px dashed var(--line2);margin-top:8px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .gold{color:var(--gold)}
.tablecard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;overflow-x:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:13px 14px;text-align:right;font-size:13px;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--line2)}
tbody td{border-bottom:1px solid var(--line);font-family:'JetBrains Mono';font-variant-numeric:tabular-nums}
tbody td:first-child{font-family:'Sora'}
.sit{font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:1px 7px;margin-left:8px}
.cell{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end}
.sdot{width:7px;height:7px;border-radius:50%;flex:none}
.sdot.pendente{background:var(--gold)} .sdot.pago{background:var(--pos)}
.muted{color:var(--muted)}
tr.entrada td{color:var(--blue);font-weight:700}
tfoot td{font-family:'JetBrains Mono';font-variant-numeric:tabular-nums;font-weight:700;padding:13px 14px;font-size:13px}
tfoot td:first-child{font-family:'Sora'}
tfoot tr.gastos td{color:var(--neg);border-top:2px solid var(--line2)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
footer{color:var(--muted);font-size:12px;margin-top:24px;line-height:1.7}
footer code{font-family:'JetBrains Mono';background:var(--surface);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Planilha · constas pessoais · ao vivo</div>
      <h1>Gastos <span>mensais</span></h1>
      <div class="sub" id="sub">Lendo direto do Google Sheets e recalculando sozinho</div>
    </div>
    <div class="controls">
      <div class="row">
        <span class="live"><span class="beat" id="beat"></span><span id="autotxt">auto</span></span>
        <select id="interval">
          <option value="15000">15s</option><option value="30000">30s</option>
          <option value="60000" selected>1 min</option><option value="300000">5 min</option><option value="0">manual</option>
        </select>
        <button class="sync" id="syncBtn"><span>Atualizar agora</span></button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </header>

  <div class="srcbar">
    <span>Fonte:</span>
    <input id="srcUrl" placeholder="cole aqui um link CSV publicado (opcional)">
    <button class="mini" id="saveUrl">Salvar fonte</button>
    <button class="mini" id="resetUrl">Padrão</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="sec">
    <div class="section-title">Por mês</div>
    <button class="btn-all" id="btnAll">Ocultar tudo</button>
  </div>
  <div class="months" id="months"></div>

  <div class="section-title" style="margin-bottom:14px">Detalhamento</div>
  <div class="tablecard">
    <table><thead id="thead"></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table>
  </div>

  <div class="legend">
    <span><span class="sdot pendente"></span> Pendente</span>
    <span><span class="sdot pago"></span> Pago</span>
    <span class="muted">— sem cobrança no mês</span>
  </div>

  <footer id="footer"></footer>
</div>

<script>
var ID="1jx8HcUYkg3yImqTDYTKwOMEO2zI-2ajGssa9OY0R-i0", GID="0";
var PUB="https://docs.google.com/spreadsheets/d/e/2PACX-1vRYmxI1l-09sAKLDI55CsS2CZ6I6ZRIsS-ozmL629INrT6Co0ID_ii1TnX8jKYrtL5_Y4FSpltz48bu/pub?gid=0&single=true&output=csv";
var EDIT="https://docs.google.com/spreadsheets/d/"+ID+"/edit";

var DATA={months:["06/2026","07/2026","08/2026","09/2026","10/2026","11/2026","12/2026"],
 entrada:[9000,9000,9000,9000,9000,9000,9000],
 items:[
  {descricao:"pensao",situacao:"fixo",valores:[660,660,660,660,660,660,660],status:["pago","pendente","pendente","pendente","pendente","pendente","pendente"]},
  {descricao:"moto alexandre",situacao:"1/4",valores:[2000,2000,2000,2000,null,null,null],status:["pago","pendente","pendente","pendente",null,null,null]},
  {descricao:"aluguel abba studio",situacao:"fixo",valores:[1000,1000,1000,1000,1000,1000,1000],status:["pago","pendente","pendente","pendente","pendente","pendente","pendente"]},
  {descricao:"teclado ph",situacao:"1/3",valores:[500,500,500,null,null,null,null],status:["pago","pendente","pendente",null,null,null,null]},
  {descricao:"alarme casa",situacao:"fixo",valores:[null,245,245,245,245,245,245],status:[null,"pendente","pendente","pendente","pendente","pendente","pendente"]},
  {descricao:"academia",situacao:"fixo",valores:[0,99,99,99,99,99,99],status:["pago","pendente","pendente","pendente","pendente","pendente","pendente"]},
  {descricao:"Claude",situacao:"fixo",valores:[null,799,799,799,799,799,799],status:[null,"pendente","pendente","pendente","pendente","pendente","pendente"]},
  {descricao:"cameras casa",situacao:"fixo",valores:[0,99,99,99,99,99,99],status:["pago","pendente","pendente","pendente","pendente","pendente","pendente"]}
 ]};

var collapsed={}, allHidden=false;

function fmt(n){return (n==null||isNaN(n))?"—":new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:0,maximumFractionDigits:2}).format(n);}
function signed(n){return (n>0?'+':'')+fmt(n);}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

function compute(){var m=DATA.months.length,g=[],sobra=[];
 for(var i=0;i<m;i++){var gg=0;DATA.items.forEach(function(it){var v=it.valores[i];if(v!=null&&!isNaN(v))gg+=Number(v);});
  g.push(gg);sobra.push(Number(DATA.entrada[i]||0)-gg);}
 return{g:g,carry:[],sobra:sobra};}

function render(){var c=compute(),M=DATA.months;
 var totEnt=DATA.entrada.reduce(function(x,y){return x+Number(y||0);},0);
 var totGas=c.g.reduce(function(x,y){return x+y;},0);
 document.getElementById('sub').textContent="Entrada total "+fmt(totEnt)+" · "+M.length+" meses · o que sobra entra no mês seguinte";
 document.getElementById('kpis').innerHTML=
  '<div class="kpi"><div class="lbl">Total de entradas</div><div class="val">'+fmt(totEnt)+'</div></div>'+
  '<div class="kpi"><div class="lbl">Total de gastos</div><div class="val neg">'+fmt(totGas)+'</div></div>'+
  '<div class="kpi"><div class="lbl">Meses</div><div class="val">'+M.length+'</div></div>';
 document.getElementById('months').innerHTML=M.map(function(mo,i){
  var bar=c.sobra[i]>=0?'var(--pos)':'var(--neg)';
  var isCol=!!collapsed[mo];
  
  return '<div class="mcard'+(isCol?' collapsed':'')+'" data-mo="'+mo+'" style="--accentbar:'+bar+'">'+
   '<div class="mhead"><span class="mname">'+mo+'</span><span class="head-right">'+
     '<span class="head-sobra '+(c.sobra[i]>=0?'pos':'neg')+'">'+fmt(c.sobra[i])+'</span><span class="chev">▼</span></span></div>'+
   '<div class="mbody">'+
     '<div class="line"><span class="k">Entrada</span><span class="v">'+(DATA.entrada[i]?fmt(DATA.entrada[i]):'<span class=muted>—</span>')+'</span></div>'+
     
     '<div class="line gastos-line"><span class="k">Gastos</span><span class="v neg">'+fmt(c.g[i])+'</span></div>'+
   '</div></div>';
 }).join('');
 document.getElementById('thead').innerHTML='<tr><th>Descrição</th>'+M.map(function(mo){return '<th>'+mo+'</th>';}).join('')+'</tr>';
 var rows='<tr class="entrada"><td>Entrada</td>'+M.map(function(_,i){return '<td>'+(DATA.entrada[i]?fmt(DATA.entrada[i]):'—')+'</td>';}).join('')+'</tr>';
 rows+=DATA.items.map(function(it){
  var cells=M.map(function(_,i){var v=it.valores[i];if(v==null||isNaN(v))return '<td><span class="muted">—</span></td>';
   var st=it.status[i]||'pendente';return '<td><span class="cell"><span class="sdot '+st+'"></span>'+fmt(v)+'</span></td>';}).join('');
  return '<tr><td><span>'+it.descricao+'</span><span class="sit">'+(it.situacao||'')+'</span></td>'+cells+'</tr>';
 }).join('');
 document.getElementById('tbody').innerHTML=rows;
 document.getElementById('tfoot').innerHTML=
  '<tr class="gastos"><td>Gastos do mês</td>'+c.g.map(function(g){return '<td>'+fmt(g)+'</td>';}).join('')+'</tr>'+
  '<tr><td>Sobrou no mês</td>'+c.sobra.map(function(s){return '<td style="color:'+(s>=0?'var(--pos)':'var(--neg)')+'">'+fmt(s)+'</td>';}).join('')+'</tr>';
 document.getElementById('footer').innerHTML='Fonte: planilha <code>constas pessoais</code> (Google Sheets, leitura pública). <a href="'+EDIT+'" target="_blank" style="color:var(--blue)">Abrir planilha</a> · Edite lá que aqui atualiza sozinho.';
 document.getElementById('btnAll').textContent=allHidden?'Mostrar tudo':'Ocultar tudo';
}

function parseCSV(t){var rows=[],row=[],f='',i=0,q=false;
 while(i<t.length){var ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=ch;}
  else{if(ch=='"')q=true;else if(ch==','){row.push(f);f='';}else if(ch=='\n'){row.push(f);rows.push(row);row=[];f='';}else if(ch=='\r'){}else f+=ch;}
  i++;}
 if(f.length||row.length){row.push(f);rows.push(row);}return rows;}
function parseNum(s){if(s==null)return null;s=String(s).trim();if(s=='')return null;
 s=s.replace(/r\$/i,'').replace(/\s/g,'');
 if(s.indexOf('.')>-1&&s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');
 else if(s.indexOf(',')>-1)s=s.replace(',','.');
 var n=parseFloat(s);return isNaN(n)?null:n;}
var monthRe=/^\d{1,2}\/\d{4}$/;
function buildData(rows){var hi=-1,mc=[];
 for(var r=0;r<rows.length;r++){var cols=rows[r],m=[];for(var c=0;c<cols.length;c++){if(monthRe.test((cols[c]||'').trim()))m.push(c);}if(m.length){hi=r;mc=m;break;}}
 if(hi<0)throw new Error('cabeçalho de meses não encontrado');
 var months=mc.map(function(c){return rows[hi][c].trim();});
 var entrada=months.map(function(){return 0;});var items=[];
 for(var r2=hi+1;r2<rows.length;r2++){var cols2=rows[r2];var desc=(cols2[0]||'').trim();if(!desc)continue;
  if(desc.toLowerCase()=='entrada'){mc.forEach(function(c,k){var v=parseNum(cols2[c]);entrada[k]=v||0;});continue;}
  var sit=(cols2[1]||'').trim();
  var valores=mc.map(function(c){return parseNum(cols2[c]);});
  var status=mc.map(function(c){var s=(cols2[c+1]||'').trim();return s?s.toLowerCase():null;});
  items.push({descricao:desc,situacao:sit,valores:valores,status:status});}
 return{months:months,entrada:entrada,items:items};}

function setStatus(msg,kind){var el=document.getElementById('status');el.textContent=msg;el.className='status '+(kind||'');
 document.getElementById('beat').className='beat '+(kind=='ok'?'on':kind=='err'?'err':kind=='load'?'load':'');}

async function fetchCSV(){var custom=(lsGet('csvUrl')||'').trim();var ts='&_='+Date.now();
 var urls=custom?[custom+(custom.indexOf('?')>-1?ts:'?_='+Date.now())]:[PUB+ts,
  'https://docs.google.com/spreadsheets/d/'+ID+'/gviz/tq?tqx=out:csv&gid='+GID+ts,
  'https://docs.google.com/spreadsheets/d/'+ID+'/export?format=csv&gid='+GID+ts];
 var lastErr;
 for(var k=0;k<urls.length;k++){try{var res=await fetch(urls[k],{cache:'no-store'});
   if(!res.ok)throw new Error('HTTP '+res.status);var txt=await res.text();
   if(txt.trim().charAt(0)=='<')throw new Error('veio HTML (acesso/login)');return txt;
  }catch(e){lastErr=e;}}
 throw lastErr||new Error('falha de rede');}

var busy=false;
async function refresh(){if(busy)return;busy=true;setStatus('Atualizando…','load');
 try{var txt=await fetchCSV();var d=buildData(parseCSV(txt));if(!d.months.length)throw new Error('sem meses');DATA=d;render();
  setStatus('Atualizado '+new Date().toLocaleTimeString('pt-BR'),'ok');
 }catch(e){console.error(e);setStatus('Erro: '+e.message+' — mostrando últimos dados','err');}
 busy=false;}

var timer=null;
function setupTimer(){if(timer)clearInterval(timer);var ms=parseInt(document.getElementById('interval').value,10);
 document.getElementById('autotxt').textContent=ms?('auto '+(ms>=60000?(ms/60000+'min'):(ms/1000+'s'))):'manual';
 if(ms)timer=setInterval(refresh,ms);}

document.getElementById('months').addEventListener('click',function(e){var card=e.target.closest('.mcard');if(!card)return;
 var mo=card.getAttribute('data-mo');collapsed[mo]=!collapsed[mo];card.classList.toggle('collapsed',collapsed[mo]);});
document.getElementById('btnAll').addEventListener('click',function(){allHidden=!allHidden;
 DATA.months.forEach(function(m){collapsed[m]=allHidden;});
 document.querySelectorAll('#months .mcard').forEach(function(c){c.classList.toggle('collapsed',allHidden);});
 this.textContent=allHidden?'Mostrar tudo':'Ocultar tudo';});
document.getElementById('syncBtn').addEventListener('click',refresh);
document.getElementById('interval').addEventListener('change',setupTimer);
document.getElementById('saveUrl').addEventListener('click',function(){var v=document.getElementById('srcUrl').value.trim();if(v){lsSet('csvUrl',v);}else{lsDel('csvUrl');}refresh();});
document.getElementById('resetUrl').addEventListener('click',function(){lsDel('csvUrl');document.getElementById('srcUrl').value='';refresh();});
var saved=lsGet('csvUrl');if(saved)document.getElementById('srcUrl').value=saved;

render();setupTimer();refresh();
</script>
</body>
</html>
